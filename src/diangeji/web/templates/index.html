<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>点歌姬 · 主播台</title>
<style>
  :root{
    --bg:#17121f; --panel:#211a2d; --line:#332a45; --text:#ece7f7; --dim:#9b91b4;
    --pink:#ff9ec7; --purple:#b58cff; --ok:#7ee2c4;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 20% -10%, #2a1f3d 0%, var(--bg) 60%);
       color:var(--text);font:14px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;min-height:100vh}
  header{display:flex;align-items:center;gap:14px;padding:18px 26px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:18px;letter-spacing:2px;font-weight:600}
  h1 span{color:var(--pink)}
  .pill{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);display:inline-block;margin-right:6px}
  .dot.off{background:#8a7f9e;box-shadow:none}
  main{display:grid;grid-template-columns:1fr 380px;gap:18px;padding:18px 26px 40px;max-width:1280px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .card h2{margin:0 0 12px;font-size:13px;color:var(--dim);font-weight:600;letter-spacing:1px}
  .np-title{font-size:22px;font-weight:600;margin:2px 0 4px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .np-meta{color:var(--dim);font-size:12px}
  .np-user{color:var(--pink)}
  .bar{height:5px;background:#2c2440;border-radius:99px;margin:14px 0 12px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--purple));border-radius:99px;transition:width .3s}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button{background:#2c2440;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px 14px;
         font:inherit;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--purple);color:#fff}
  button.primary{background:linear-gradient(135deg,var(--pink),var(--purple));color:#1a1424;border:0;font-weight:600}
  button:disabled{opacity:.45;cursor:not-allowed}
  ul.q{list-style:none;margin:0;padding:0}
  ul.q li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #2c2440}
  ul.q li:last-child{border-bottom:0}
  .idx{width:22px;color:var(--dim);font-size:12px;text-align:right}
  .who{color:var(--pink);font-size:12px;min-width:64px}
  .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{font-size:11px;color:#1a1424;background:var(--ok);border-radius:6px;padding:0 6px}
  .badge.warn{background:#ffcf7a}
  .del{background:none;border:0;color:#6f6588;cursor:pointer;font-size:15px;padding:0 6px}
  .del:hover{color:#ff8fa0}
  .empty{color:#6f6588;padding:10px 0}
  input[type=text]{width:100%;background:#1a1424;border:1px solid var(--line);border-radius:10px;
                   color:var(--text);padding:10px 12px;font:inherit;outline:none}
  input[type=text]:focus{border-color:var(--purple)}
  .hint{color:#6f6588;font-size:12px;margin-top:8px}
  .log{color:var(--dim);font-size:12px;max-height:220px;overflow:auto}
  .log div{padding:3px 0;border-bottom:1px dotted #2c2440}
  .log b{color:var(--purple);font-weight:400}
  footer{color:#5f5675;font-size:12px;text-align:center;padding:0 0 24px}
  .hero{position:fixed;bottom:0;pointer-events:none;user-select:none;
        height:min(52vh,520px);opacity:.92;z-index:3;
        filter:drop-shadow(0 0 24px rgba(181,140,255,.18));
        -webkit-mask-image:linear-gradient(to bottom,#000 78%,transparent 100%);
        mask-image:linear-gradient(to bottom,#000 78%,transparent 100%)}
  .hero.l{left:-40px}
  .hero.r{right:-40px;transform:scaleX(-1)}
  header,main,footer{position:relative;z-index:1}
  @media (max-width:1100px){ .hero{display:none} }
</style>
</head>
<body>
<img class="hero l" src="/asset/hero_web.png" alt="">
<img class="hero r" src="/asset/hero_web.png" alt="">
<header>
  <h1>点<span>歌</span>姬</h1>
  <span class="pill" id="room">房间 —</span>
  <span class="pill"><span class="dot" id="dmdot"></span><span id="dmtext">弹幕未连接</span></span>
  <span class="pill">曲库 <b id="lib">__LIBCOUNT__</b> 首</span>
  <span class="pill">v__VERSION__</span>
  <span style="flex:1"></span>
  <span class="pill" id="tick">—</span>
</header>

<main>
  <section class="card">
    <h2>正在播放</h2>
    <div class="np-title" id="npTitle">等待点歌</div>
    <div class="np-meta" id="npMeta">发「点歌 歌名」</div>
    <div class="bar"><i id="npBar"></i></div>
    <audio id="au" preload="auto" crossorigin="use-credentials"></audio>
    <div class="row">
      <button class="primary" id="btnPause">暂停</button>
      <button id="btnPrev">上一首</button>
      <button id="btnNext">下一首</button>
      <button id="btnIdle">空闲随机：开</button>
      <button id="btnClear">清空</button>
    </div>
    <div class="row" style="margin-top:12px">
      <span style="color:var(--dim);font-size:12px">音量</span>
      <input type="range" id="vol" min="0" max="100" step="1" style="flex:1;accent-color:var(--purple)">
      <span id="volText" style="color:var(--dim);font-size:12px;width:34px;text-align:right">20</span>
    </div>
    <div class="hint">本页静音播放（声音由 OBS 那一层出）。歌播完会自动切下一首，只上报一次。</div>
  </section>

  <section class="card">
    <h2>点歌</h2>
    <input type="text" id="cmd" placeholder="点歌 晴天（回车）">
    <div class="hint">也可以在直播间发弹幕：点歌 / 点播 / 来一首 / 想听</div>
    <h2 style="margin-top:18px">队列 <span id="qlen" style="color:#6f6588"></span></h2>
    <ul class="q" id="queue"><li class="empty">队列是空的</li></ul>
  </section>

  <section class="card" style="grid-column:1">
    <h2>日志</h2>
    <div class="log" id="log"></div>
  </section>

  <section class="card">
    <h2>历史</h2>
    <ul class="q" id="hist"><li class="empty">还没播过</li></ul>
  </section>
</main>
<footer>点歌姬 · 本地服务，只监听 127.0.0.1</footer>

<script>
const S0 = __STATE__;
let S = S0;
let curId = null;            // 当前播放项的 id：上报 ended 时带上，服务端只认它
let endedSent = false;       // 同一首歌只上报一次
let offline = 0;
const MUTE = new URLSearchParams(location.search).get('mute') === '1';

const au = document.getElementById('au');
const npTitle = document.getElementById('npTitle');
const npMeta = document.getElementById('npMeta');
const npBar = document.getElementById('npBar');

function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(t){ if(!t) return '—'; const d=new Date(t*1000); return d.toTimeString().slice(0,5); }

function goOffline(){
  document.getElementById('dmtext').textContent = '服务未连接';
  document.getElementById('dmdot').classList.add('off');
}

function render(s){
  S = s;
  // ---- 弹幕状态 ----
  const dm = s.dm || {};
  const dmText = dm.connected
      ? `弹幕已连接${dm.room ? ' · 房间 ' + dm.room : ''}`
      : (dm.room ? '弹幕断开，重连中' : '弹幕未连接');
  document.getElementById('dmtext').textContent = dmText;
  document.getElementById('dmdot').classList.toggle('off', !dm.connected);
  document.getElementById('room').textContent = '房间 ' + (dm.room || '—');
  document.getElementById('lib').textContent = s.lib ?? 0;
  if (dm.last) document.getElementById('dmtext').textContent = dmText + ' · ' + dm.last;

  // ---- 正在播放 ----
  const np = s.playing;
  npTitle.textContent = np ? (np.title || '—') : '等待点歌';
  npMeta.innerHTML = np
      ? `<span class="np-user">${esc(np.user || '观众')}</span> 点播 · ${esc(np.source === 'qq' ? 'QQ 音乐' : '本地曲库')}`
        + (np.path ? '' : ' · <span style="color:#ffcf7a">缺音源</span>')
        + (np.idle ? ' · 空闲随机' : '')
      : (s.idle ? '空闲随机开着，队列空的时候会自动放' : '发「点歌 歌名」');
  document.getElementById('btnPause').textContent = s.paused ? '继续' : '暂停';
  document.getElementById('btnIdle').textContent = '空闲随机：' + (s.idle ? '开' : '关');
  document.getElementById('volText').textContent = s.volume ?? 20;
  const volEl = document.getElementById('vol');
  if (document.activeElement !== volEl) volEl.value = s.volume ?? 20;

  // ---- 队列 ----
  const q = s.queue || [];
  const qEl = document.getElementById('queue');
  qEl.innerHTML = q.length ? q.map((it,i)=>`
    <li>
      <span class="idx">${i+1}</span>
      <span class="who">${esc(it.user)}</span>
      <span class="tt">${esc(it.title)}</span>
      ${it.path ? '' : '<span class="badge warn">缺音源</span>'}
      <span class="badge">${it.source === 'qq' ? 'QQ' : '本地'}</span>
      <button class="del" data-id="${esc(it.id)}" title="删除">×</button>
    </li>`).join('') : '<li class="empty">队列是空的</li>';
  document.getElementById('qlen').textContent = q.length ? `（${q.length} 首）` : '';

  // ---- 历史 ----
  const h = (s.history || []).slice().reverse().slice(0, 12);
  document.getElementById('hist').innerHTML = h.length ? h.map(it=>`
    <li><span class="tt">${esc(it.title)}</span>
        <span style="color:#6f6588;font-size:12px">${esc(it.user)}</span></li>`).join('')
    : '<li class="empty">还没播过</li>';

  // ---- 日志 ----
  const logs = (s.log || []).slice(-40);
  document.getElementById('log').innerHTML = logs.map(e=>
      `<div><b>${fmt(e.t)}</b> ${esc(e.text)}</div>`).join('') || '<div>（还没有动作）</div>';

  // ---- 播放器同步 ----
  syncAudio(s);
}

function syncAudio(s){
  const np = s.playing;
  // 用 id 而不是 path 判断「换歌了」：同一个人连点两次同一首本地歌时，
  // 前后两首 path 完全相同，按 path 判断会漏掉第二首，播放器停在结尾不动。
  const wantId = np && np.id ? np.id : null;
  const wantSrc = np && np.path
    ? (/^https?:/i.test(np.path) ? np.path : ('/media/' + encodeURI(np.path.replace(/\\/g,'/'))))
    : null;
  au.volume = Math.max(0, Math.min(1, (s.volume ?? 20) / 100));
  au.muted = MUTE;                       // 主播台静音，声音只从 OBS 层出

  if (np && np.path && wantId !== curId){
    curId = wantId;
    endedSent = false;
    au.src = wantSrc;
    au.play().catch(()=>{});
  } else if (np && np.path && (!au.src || au.currentSrc !== new URL(wantSrc, location.href).href)){
    // 直链刷新了（QQ 音乐的 vkey 会过期），id 没变但地址变了 → 换源续播
    au.src = wantSrc;
    if (!s.paused) au.play().catch(()=>{});
  } else if (!np && curId){
    curId = null; endedSent = false;
    au.pause(); au.removeAttribute('src');
  }

  if (s.paused){ au.pause(); }
  else if (curId && au.paused){ au.play().catch(()=>{}); }

  // 进度条：有 duration 就用真实进度，没有就显示一条空槽
  if (curId && au.duration > 0){
    npBar.style.width = Math.min(100, (au.currentTime / au.duration) * 100) + '%';
  } else {
    npBar.style.width = '0%';
  }
}

// 唱完 → 上报带 id 的 ended；服务端只认当前播放项，两个页面同时开也不会跳两首
au.addEventListener('ended', ()=>{
  if (!curId || endedSent) return;
  endedSent = true;
  fetch('/api/ended', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({id: curId})}).then(r=>r.json()).then(j=>{ if(j.state) render(j.state); })
    .catch(()=>{});
});
au.addEventListener('timeupdate', ()=>{
  if (au.duration > 0) npBar.style.width = Math.min(100,(au.currentTime/au.duration)*100)+'%';
});

async function refresh(){
  try{
    const s = await (await fetch('/api/state', {cache:'no-store'})).json();
    offline = 0;
    document.getElementById('tick').textContent = '更新于 ' + new Date().toTimeString().slice(0,8);
    render(s);
  }catch(e){ if (++offline >= 1) goOffline(); }
}

function post(path, body){
  return fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body||{})}).then(r=>r.json()).then(j=>{
      if (j.state) render(j.state);
      return j;
    }).catch(()=>{});
}

function send(){
  const el = document.getElementById('cmd');
  const t = el.value.trim();
  if(!t) return;
  post('/api/order', {user:'主播', text:t});
  el.value='';
}

document.getElementById('btnNext').onclick  = ()=>post('/api/skip');
document.getElementById('btnPrev').onclick  = ()=>post('/api/prev');
document.getElementById('btnPause').onclick = ()=>post('/api/pause');
document.getElementById('btnIdle').onclick  = ()=>post('/api/idle');
document.getElementById('btnClear').onclick = ()=>{ if(confirm('清空队列并停止播放？')) post('/api/clear'); };
document.getElementById('vol').oninput = e=>{ document.getElementById('volText').textContent = e.target.value; };
document.getElementById('vol').onchange = e=>post('/api/volume', {value: Number(e.target.value)});
document.getElementById('queue').onclick = e=>{
  const id = e.target.getAttribute && e.target.getAttribute('data-id');
  if (id) post('/api/remove', {id});
};
document.getElementById('cmd').addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });

render(S0);
setInterval(refresh, 3000);
</script>
</body>
</html>
